apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-devsecops-demo
  namespace: java-devsecops
  labels:
    app: java-devsecops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-devsecops-demo
  template:
    metadata:
      labels:
        app: java-devsecops-demo
    spec:
     # topologySpreadConstraints:
     #   - maxSkew: 1
     #     topologyKey: topology.kubernetes.io/zone
     #     whenUnsatisfiable: DoNotSchedule
     #     labelSelector:
     #       matchLabels:
     #         app: java-devsecops-demo
      containers:
        - name: java-devsecops-demo
          image: java-devsecops-demo:latest
          ports:
            - containerPort: 8080

            
